name: Build NOAA NARR particle package

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Case folder ID
        required: true
      start_utc:
        description: First valid time in YYYY-MM-DDTHH
        required: true
        default: "2022-05-12T00"
      end_utc:
        description: Last valid time in YYYY-MM-DDTHH
        required: true
        default: "2022-05-12T21"
      step_hours:
        description: Time step in hours
        required: true
        default: "3"
      products:
        description: Comma-separated surface,500mb
        required: true
        default: surface,500mb

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install NOAA particle builder
        run: python -m pip install -r github_particle_builder/requirements.txt
      - name: Build surface and upper-air velocity fields
        run: >-
          python github_particle_builder/build_particles.py
          --case-id "${{ inputs.case_id }}"
          --start-utc "${{ inputs.start_utc }}"
          --end-utc "${{ inputs.end_utc }}"
          --step-hours "${{ inputs.step_hours }}"
          --products "${{ inputs.products }}"
      - name: Publish stable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          CASE_ID: ${{ inputs.case_id }}
        run: |
          tag="particles-${CASE_ID}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "NARR particles: ${CASE_ID}" --notes "Preprocessed NOAA NARR wind particles for Weather Discovery Lab."
          gh release upload "$tag" output/NARR_particles_*.zip --clobber
      - name: Keep a workflow artifact copy
        uses: actions/upload-artifact@v6
        with:
          name: narr-particles-${{ inputs.case_id }}
          path: output/NARR_particles_*.zip
          retention-days: 30
